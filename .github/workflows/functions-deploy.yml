name: Functions deploy

# Staging: deployed automatically when the Edge Functions change on main (or manually).
# Production: manual only, and the job waits for the required reviewer.
# The function's secrets (VAPID keys, Brevo key, ...) are set in Supabase, never here: see docs/deployment.md.
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy to
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only check the secrets and list what is deployed, deploy nothing
        type: boolean
        default: true

concurrency: functions-deploy-${{ inputs.target || 'staging' }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && 'gwkmptdhlzmhzztlcqco' || 'wxrzcoxwnvxkplnekunl' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check required secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is missing or empty"
            exit 1
          fi

      # Names only (Supabase never shows the values). A missing one is a warning, not a failure: the function
      # answers with an error until it is set, and nothing in the outbox is touched before that.
      - name: Check the function's own secrets
        run: |
          names=$(npx supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).map(x=>x.name).join(' ')))")
          for name in CRON_SECRET APP_URL VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY BREVO_API_KEY; do
            case " $names " in
              *" $name "*) echo "ok: $name" ;;
              *) echo "::warning::Edge Function secret $name is not set on $SUPABASE_PROJECT_REF" ;;
            esac
          done

      - name: Deploy send-notifications
        if: ${{ !inputs.dry_run }}
        run: npx supabase functions deploy send-notifications --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api

      - name: Show what is deployed
        run: npx supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
