name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The development sign-in (test accounts, password panel) must never reach the production bundle.
      - name: Check the build has no development sign-in
        run: |
          if grep -rIl --include='*.js' --include='*.html' -e 'example\.test' -e 'Prijava test nalogom' -e 'VITE_DEV_LOGIN_PASSWORD' dist; then
            echo "::error::The production build contains development sign-in code"
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Supabase's local ports (54320-54330) lie inside the range Linux hands out to outgoing connections, and the many
      # image downloads before the start can take one ("address already in use"). Keep the system from using them.
      - name: Keep the local Supabase ports free
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54330
      # A start that fails because a port is taken is tried again from a clean slate; what holds the ports is printed
      # each time, so a lasting problem shows in the log.
      - name: Start the local Supabase stack
        run: |
          for attempt in 1 2 3; do
            if npm run db:start; then exit 0; fi
            echo "::warning::db:start failed (attempt $attempt of 3)"
            echo "--- who listens on the Supabase ports"
            sudo ss -ltnp | grep -E ':543[0-9]{2}\b' || echo "nobody"
            echo "--- containers"
            docker ps -a --format '{{.Names}} {{.Status}} {{.Ports}}'
            npx supabase stop --no-backup || true
            sleep 5
          done
          exit 1
      - run: npm run db:test
      - run: npm run db:test:concurrency
