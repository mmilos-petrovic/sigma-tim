name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The development sign-in (test accounts, password panel) must never reach the production bundle.
      - name: Check the build has no development sign-in
        run: |
          if grep -rIl --include='*.js' --include='*.html' -e 'example\.test' -e 'Prijava test nalogom' -e 'VITE_DEV_LOGIN_PASSWORD' dist; then
            echo "::error::The production build contains development sign-in code"
            exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:test:concurrency
