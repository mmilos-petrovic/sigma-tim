name: Database migrate

# Staging: applied automatically when migrations change on main (or manually).
# Production: manual only, and the job waits for the required reviewer.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:
    inputs:
      target:
        description: Environment to migrate
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: Only show which migrations would be applied
        type: boolean
        default: true

concurrency: db-migrate-${{ inputs.target || 'staging' }}

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && 'gwkmptdhlzmhzztlcqco' || 'wxrzcoxwnvxkplnekunl' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check required secrets are set
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty"
              exit 1
            fi
          done

      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: npx supabase db push --dry-run
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: npx supabase db push
